html/head_include="<link rel=\"icon\" href=\"favicon.ico\">\n<link rel=\"icon\" type=\"image/png\" sizes=\"32x32\" href=\"favicon-32.png\">\n<link rel=\"icon\" type=\"image/png\" sizes=\"16x16\" href=\"favicon-16.png\">\n<link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"apple-touch-icon.png\">\n<link rel=\"manifest\" href=\"site.webmanifest\">\n<meta name=\"theme-color\" content=\"#0b131d\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<style>\nbody{background:#0b131d!important}#status{background:#0b131d!important;color:#e4b66c!important}\n#cw-fullscreen-help[hidden]{display:none!important}\n#cw-fullscreen-help{position:fixed;inset:0;z-index:101;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}\n#cw-fullscreen-card{box-sizing:border-box;width:min(100%,480px);max-height:90%;overflow:auto;background:#111e28;color:#e8e4d5;border:1px solid #e4b66c;border-radius:12px;padding:20px;font:17px/1.6 sans-serif}\n#cw-fullscreen-card li{margin-bottom:12px}#cw-fullscreen-card button{margin-top:8px}#cw-fullscreen-card h2{font-size:22px;margin:0 0 12px}#cw-fullscreen-card button{min-height:44px;padding:8px 20px;font:inherit}\n</style>\n<script>\n(function(){\n  function prepareAudio(){\n    try {\n      if(navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';\n    } catch(error) { /* Older browsers may not support changing the session. */ }\n  }\n  document.addEventListener('pointerdown',prepareAudio,true);\n  document.addEventListener('touchend',prepareAudio,true);\n  document.addEventListener('keydown',prepareAudio,true);\n})();\n</script>\n<script>\nvar cwInstallPrompt=null;\nwindow.addEventListener('beforeinstallprompt',function(event){event.preventDefault();cwInstallPrompt=event;window.dispatchEvent(new Event('cw-install-ready'));});\ndocument.addEventListener('DOMContentLoaded',function(){\n  var root=document.documentElement;\n  var overlay=document.createElement('div');\n  overlay.id='cw-fullscreen-help';overlay.hidden=true;\n  var card=document.createElement('section');\n  card.id='cw-fullscreen-card';card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');card.setAttribute('aria-labelledby','cw-fullscreen-title');\n  var title=document.createElement('h2');title.id='cw-fullscreen-title';title.textContent='全螢幕遊玩';\n  var message=document.createElement('p');\n  var close=document.createElement('button');close.type='button';close.textContent='返回遊戲';\n  var enter=document.createElement('button');enter.type='button';enter.textContent='開啟全螢幕';enter.hidden=true;enter.style.marginRight='12px';\n  var install=document.createElement('button');install.type='button';install.textContent='設定全螢幕';install.style.marginRight='12px';\n  var steps=document.createElement('ol');steps.hidden=true;\n  var offered=false;\n  var interaction=0;\n  // iPad fullscreen touch interaction can trigger Safari's typing protection.\n  // Use the Home Screen web app flow on Apple mobile devices instead.\n  function appleMobile(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}\n  function canFullscreen(){return !appleMobile()&&!!(root.requestFullscreen||root.webkitRequestFullscreen)&&document.fullscreenEnabled!==false&&document.webkitFullscreenEnabled!==false;}\n  window.cwFullscreenPromptOpen=false;\n  card.append(title,message,steps,enter,install,close);overlay.append(card);document.body.append(overlay);\n  function standalone(){return navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches;}\n  function focusGame(){var canvas=document.getElementById('canvas');if(canvas)canvas.focus();}\n  function dismiss(){interaction++;overlay.hidden=true;window.cwFullscreenPromptOpen=false;focusGame();}\n  function help(failed){\n    enter.hidden=true;close.textContent='返回遊戲';steps.replaceChildren();steps.hidden=false;\n    title.textContent='加入主畫面遊玩';\n    var apple=appleMobile();\n    message.textContent=apple?'加入後，從主畫面圖示開啟，遊戲畫面更大。iPhone／iPad 需要你手動完成以下步驟：':(failed?'未能開啟全螢幕，可改用主畫面 App 遊玩。':'可嘗試加入主畫面，下次點遊戲圖示開啟；如瀏覽器沒有此選項，請用 Safari、Chrome 或 Edge 開啟本遊戲。');\n    var instructions=apple?['在 Safari 開啟本遊戲，點「分享」（方框向上箭嘴；可能在「⋯」選單內）。','選「加入主畫面」，如有「以網頁 App 開啟」，保持開啟，再點「加入」。','回到手機主畫面，點「冷戰迷宮」圖示開始。']:['打開瀏覽器選單「⋮」或「⋯」。','選「安裝應用程式」或「加入主畫面」（如有提供），並確認。','完成後，從主畫面的「冷戰迷宮」圖示開啟；畫面模式視乎瀏覽器支援。'];\n    instructions.forEach(function(text){var li=document.createElement('li');li.textContent=text;steps.append(li);});\n    install.hidden=!cwInstallPrompt;install.textContent='加入主畫面';\n    overlay.hidden=false;window.cwFullscreenPromptOpen=true;(install.hidden?close:install).focus();\n  }\n  install.addEventListener('click',async function(){\n    if(!cwInstallPrompt){help(false);return;}\n    var prompt=cwInstallPrompt;cwInstallPrompt=null;install.disabled=true;var ticket=++interaction;\n    try{await prompt.prompt();await prompt.userChoice;if(ticket===interaction)dismiss();}\n    catch(error){if(ticket===interaction)help(false);}\n    finally{install.disabled=false;}\n  });\n  window.addEventListener('cw-install-ready',function(){if(!overlay.hidden){install.hidden=false;install.textContent='加入主畫面';}});\n  window.addEventListener('appinstalled',function(){cwInstallPrompt=null;dismiss();});\n  window.cwRequestFullscreen=function(){\n    if(document.fullscreenElement||document.webkitFullscreenElement||standalone()){dismiss();return;}\n    var request=root.requestFullscreen||root.webkitRequestFullscreen;\n    if(!canFullscreen()){if(cwInstallPrompt){install.click();}else{help(false);}return;}\n    var ticket=++interaction;\n    try{var result=request.call(root);if(result&&result.catch)result.catch(function(){if(ticket===interaction)help(true);});}\n    catch(error){if(ticket===interaction)help(true);}\n  };\n  window.cwOfferFullscreen=function(){\n    if(offered)return false;\n    offered=true;\n    if(document.fullscreenElement||document.webkitFullscreenElement||standalone())return false;\n    title.textContent='全螢幕遊玩';steps.hidden=true;install.hidden=false;install.textContent=cwInstallPrompt?'加入主畫面':(canFullscreen()?'加入主畫面指引':'設定全螢幕');\n    message.textContent=appleMobile()?'為避免 iPad／iPhone 的全螢幕輸入提示，建議加入主畫面後開啟遊戲。按「設定全螢幕」查看步驟，或選「暫時不用」直接遊玩。':canFullscreen()?'建議使用全螢幕，睇題目更清楚，操作更方便。之後亦可在暫停選單開啟。':(cwInstallPrompt?'此瀏覽器無法直接全螢幕。按「加入主畫面」開啟安裝視窗。':'此瀏覽器無法直接全螢幕。按「設定全螢幕」查看加入主畫面的步驟；實際畫面視乎瀏覽器支援。');\n    enter.hidden=!canFullscreen();close.textContent='暫時不用';overlay.hidden=false;\n    window.cwFullscreenPromptOpen=true;(enter.hidden?install:enter).focus();return true;\n  };\n  enter.addEventListener('click',function(){enter.hidden=true;window.cwRequestFullscreen();});\n  document.addEventListener('fullscreenchange',function(){if(document.fullscreenElement)dismiss();});\n  document.addEventListener('webkitfullscreenchange',function(){if(document.webkitFullscreenElement)dismiss();});\n  close.addEventListener('click',dismiss);\n  overlay.addEventListener('click',function(event){if(event.target===overlay)dismiss();});\n  overlay.addEventListener('keydown',function(event){if(event.key==='Escape'){event.preventDefault();event.stopPropagation();dismiss();}else if(event.key==='Tab'){event.preventDefault();var buttons=[enter,install,close].filter(function(button){return !button.hidden&&!button.disabled;});var index=buttons.indexOf(document.activeElement);buttons[(index+(event.shiftKey?-1:1)+buttons.length)%buttons.length].focus();}});\n\n});\n</script>"
html/canvas_resize_policy=2
