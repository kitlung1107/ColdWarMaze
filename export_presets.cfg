[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*,tools/*,*.md"
export_path="../ColdWarMaze-Web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#0b131d\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<style>\nbody{background:#0b131d!important}#status{background:#0b131d!important;color:#e4b66c!important}\n#cw-fullscreen-help[hidden]{display:none!important}\n#cw-fullscreen-help{position:fixed;inset:0;z-index:101;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}\n#cw-fullscreen-card{box-sizing:border-box;width:min(100%,480px);max-height:90%;overflow:auto;background:#111e28;color:#e8e4d5;border:1px solid #e4b66c;border-radius:12px;padding:20px;font:17px/1.6 sans-serif}\n#cw-fullscreen-card h2{font-size:22px;margin:0 0 12px}#cw-fullscreen-card button{min-height:44px;padding:8px 20px;font:inherit}\n</style>\n<script>\ndocument.addEventListener('DOMContentLoaded',function(){\n  var root=document.documentElement;\n  var overlay=document.createElement('div');\n  overlay.id='cw-fullscreen-help';overlay.hidden=true;\n  var card=document.createElement('section');\n  card.id='cw-fullscreen-card';card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');card.setAttribute('aria-labelledby','cw-fullscreen-title');\n  var title=document.createElement('h2');title.id='cw-fullscreen-title';title.textContent='全螢幕遊玩';\n  var message=document.createElement('p');\n  var close=document.createElement('button');close.type='button';close.textContent='返回遊戲';\n  card.append(title,message,close);overlay.append(card);document.body.append(overlay);\n  function standalone(){return navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches;}\n  function focusGame(){var canvas=document.getElementById('canvas');if(canvas)canvas.focus();}\n  function dismiss(){overlay.hidden=true;focusGame();}\n  function help(failed){\n    var apple=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);\n    message.textContent=apple?'請在 Safari 的分享選單選擇「加入主畫面」。如有「以網頁 App 開啟」選項，請開啟它，再由主畫面的遊戲圖示進入，移除瀏覽器工具列。系統狀態或手勢區可能仍會保留。':(failed?'瀏覽器未能進入全螢幕。你可以再試一次，或在瀏覽器選單尋找「安裝應用程式」／「加入主畫面」（如有提供）。':'這個瀏覽器未提供全螢幕功能。請用瀏覽器直接開啟遊戲，或在選單尋找「安裝應用程式」／「加入主畫面」（如有提供）。');\n    overlay.hidden=false;close.focus();\n  }\n  window.cwRequestFullscreen=function(){\n    if(document.fullscreenElement||document.webkitFullscreenElement||standalone()){focusGame();return;}\n    var request=root.requestFullscreen||root.webkitRequestFullscreen;\n    if(!request){help(false);return;}\n    try{var result=request.call(root);if(result&&result.catch)result.catch(function(){help(true);});}\n    catch(error){help(true);}\n  };\n  close.addEventListener('click',dismiss);\n  overlay.addEventListener('click',function(event){if(event.target===overlay)dismiss();});\n  overlay.addEventListener('keydown',function(event){if(event.key==='Escape'){event.preventDefault();event.stopPropagation();dismiss();}else if(event.key==='Tab'){event.preventDefault();close.focus();}});\n\n});\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
